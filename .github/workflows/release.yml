name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Test source
        run: npm test

      - name: Build minified release
        run: npm run build
        env:
          GLOW_VERSION: ${{ github.ref_name }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" .release/glow-cards.js .release/glow-card.css --verify-tag --generate-notes --title "Glow Cards ${{ github.ref_name }}"
